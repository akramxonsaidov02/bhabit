name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v4

    - name: Node.js ni sozlash
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Kutubxonalarni o'rnatish
      run: npm install --legacy-peer-deps

    - name: Saytni build qilish (Vite)
      run: |
        npx vite build || npm run build || true
        mkdir -p dist
        if [ ! -f "dist/index.html" ]; then
          cp index.html dist/ 2>/dev/null || true
          if [ -d "public" ]; then cp -r public/* dist/ 2>/dev/null || true; fi
        fi

    - name: Capacitor ni o'rnatish va sinxronlash
      run: |
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli
        rm -rf android capacitor.config.*
        npx cap init "Bhabit" "com.bhabit.app" --web-dir dist
        npx cap add android
        npx cap sync android

    - name: Java (JDK) o'rnatish
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: APK faylini yaratish
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: APK ni yuklab olish uchun tayyorlash
      uses: actions/upload-artifact@v4
      with:
        name: Bhabit-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
